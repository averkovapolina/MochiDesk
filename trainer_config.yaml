behaviors:
  CatSorting:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 500000
    time_horizon: 128
    checkpoint_interval: 50000
    summary_freq: 10000

environment_parameters:
  spawn_radius:
    curriculum:
      - name: Near
        completion_criteria:
          measure: progress
          behavior: CatSorting
          threshold: 0.25
        value: 0.22
      - name: Medium
        completion_criteria:
          measure: progress
          behavior: CatSorting
          threshold: 0.5
        value: 0.45
      - name: Anywhere
        value: 10.0